name: Static site checks

on:
  push:
    branches: [main]
    paths:
      - 'develop-with-raman/**'
      - 'scripts/check-site.mjs'
      - '.github/workflows/site-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'develop-with-raman/**'
      - 'scripts/check-site.mjs'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static site audit
        run: node scripts/check-site.mjs
