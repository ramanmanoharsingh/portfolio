name: Portal validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (no production changes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find develop-with-raman -type f -name '*.js' -print0)

      - name: Syntax-check inline scripts in homepage HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("develop-with-raman/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', html, re.IGNORECASE)
          checked = 0
          for attributes, source in scripts:
              module = "type=\"module\"" in attributes.lower()
              command = ["node", "--check", "--input-type=module"] if module else ["node", "--check"]
              result = subprocess.run(command, input=source, text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(result.returncode)
              checked += 1
          if not checked:
              raise SystemExit("No inline scripts found in homepage HTML")
          print(f"Syntax-checked {checked} inline homepage script(s).")
          PY

      - name: Validate client dashboard update hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-dashboard-tab="notifications"' develop-with-raman/client-dashboard.html
          grep -q 'data-dashboard-panel="notifications"' develop-with-raman/client-dashboard.html
          grep -q 'data-notification-list' develop-with-raman/client-dashboard.html
          grep -q 'data-notification-count' develop-with-raman/client-dashboard.html
          grep -q 'data-mark-updates-read' develop-with-raman/client-dashboard.html
          grep -q 'client-dashboard.html#notifications' develop-with-raman/index.html
          grep -q 'admin-portal.html' develop-with-raman/index.html
          test -f develop-with-raman/client-portal.css
          echo "Client dashboard update hooks and role navigation are present."

      - name: Validate similar-project request handoff
        shell: bash
        run: |
          set -euo pipefail
          grep -q "client-dashboard.html?request=1&service=" develop-with-raman/index.html
          grep -q "queryParams.get('request')==='1'" develop-with-raman/client-portal.js
          grep -q "sb.from('proposals').insert(data)" develop-with-raman/client-portal.js
          grep -q "location.replace('/client-dashboard.html?submitted=1#requests')" develop-with-raman/client-portal.js
          grep -Fq 'identityLink.href=activeUserRole==="admin"?"/admin-portal.html":"/client-dashboard.html";' develop-with-raman/index.html
          grep -Fq "root.dataset.role==='admin'&&role!=='admin'" develop-with-raman/client-portal.js
          grep -Fq "root.dataset.role==='client'&&role==='admin'&&root.dataset.page!=='welcome'" develop-with-raman/client-portal.js
          echo "Request handoff, proposal submission, and client/admin role-routing hooks are present."
          # Request intake must be wired before optional dashboard data is loaded.
          python3 - <<'PY'
          from pathlib import Path
          source = Path("develop-with-raman/client-portal.js").read_text(encoding="utf-8")
          modal = source.find("setupProposalModal(sb,user);")
          projects = source.find("const {data:projects,error:projectError}")
          if modal < 0 or projects < 0 or modal > projects:
              raise SystemExit("Client request modal must initialize before dashboard project queries.")
          print("Client request modal initializes before dashboard data queries.")
          PY
          grep -q "function setupProposalModal(sb,user)" develop-with-raman/client-portal.js
          grep -q "We could not verify your sign-in state" develop-with-raman/index.html
          grep -q "document.getElementById('sg').addEventListener('click'" develop-with-raman/index.html
          grep -Fq "const sessionMode=document.cookie.split(';').some(c=>c.trim()==='portal_session=1')" develop-with-raman/index.html
          grep -Fq 'storage:sessionMode?window.sessionStorage:window.localStorage' develop-with-raman/index.html
          echo "Homepage and portal use the same remember-me session storage mode."
          # A failed role lookup must stop the handoff, not be treated as a verified client role.
          python3 - <<'PY'
          from pathlib import Path

          homepage = Path("develop-with-raman/index.html").read_text(encoding="utf-8")
          start = homepage.find("const isClientSession=async session=>")
          end = homepage.find("const draftFields=", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the homepage account-role helper.")
          helper = homepage[start:end]
          catch_at = helper.find("}catch(error){")
          if catch_at < 0:
              raise SystemExit("Account-role lookup needs an explicit error handler.")
          catch_block = helper[catch_at:]
          if "throw error;" not in catch_block or "return true;" in catch_block:
              raise SystemExit("Unverified roles must not be treated as clients.")
          if "We could not verify your sign-in state. Your request has not been submitted" not in homepage:
              raise SystemExit("Service-selection errors must tell users the request was not submitted.")
          if "We could not check your account just now." not in homepage:
              raise SystemExit("Similar-project handoff errors need a recoverable status message.")
          print("Account-role lookup failures stop and surface the request handoff.")
          PY
          echo "Client request intake and service-selection safeguards are present."
          grep -q 'href="#milestones-admin"' develop-with-raman/admin-portal.html
          grep -q 'href="#deliverables-admin"' develop-with-raman/admin-portal.html
          grep -q 'href="#billing-admin"' develop-with-raman/admin-portal.html
          grep -q 'href="#proposals-admin"' develop-with-raman/admin-portal.html
          grep -q 'data-admin-refresh' develop-with-raman/admin-portal.html
          grep -q "Dashboard data refreshed." develop-with-raman/admin-portal.js
          echo "Admin navigation and refresh controls are present."

      - name: Confirm workflow docs exist
        run: |
          test -f docs/WORKFLOW_OVERHAUL_PLAN.md
          test -f docs/DEPLOYMENT_AND_ROLLBACK.md
