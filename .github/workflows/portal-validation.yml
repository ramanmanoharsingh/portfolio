name: Portal validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/workflow-overhaul]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (no production changes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find develop-with-raman -type f -name '*.js' -print0)

      - name: Validate client dashboard update hooks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-dashboard-tab="notifications"' develop-with-raman/client-dashboard.html
          grep -q 'data-dashboard-panel="notifications"' develop-with-raman/client-dashboard.html
          grep -q 'data-notification-list' develop-with-raman/client-dashboard.html
          grep -q 'data-notification-count' develop-with-raman/client-dashboard.html
          grep -q 'data-mark-updates-read' develop-with-raman/client-dashboard.html
          grep -q 'client-dashboard.html#notifications' develop-with-raman/index.html
          grep -q 'admin-portal.html' develop-with-raman/index.html
          test -f develop-with-raman/client-portal.css
          echo "Client dashboard update hooks and role navigation are present."

      - name: Confirm workflow docs exist
        run: |
          test -f docs/WORKFLOW_OVERHAUL_PLAN.md
          test -f docs/DEPLOYMENT_AND_ROLLBACK.md
