<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose a new password · Develop with Raman</title><link rel="stylesheet" href="/client-portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/portal-supabase.js"></script><script defer src="/reset-password.js"></script></head><body class="portal-body"><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="portal-card" style="width:min(100%,480px);padding:clamp(24px,5vw,42px)"><a class="portal-brand" style="padding:0;display:block;margin-bottom:30px" href="/">Develop with Raman<span>Account security</span></a><div class="eyebrow" id="password-page-eyebrow">Password reset</div><h1 class="portal-title" id="password-page-title" style="font-size:34px">Choose a new password.</h1><p class="portal-subtitle" id="password-page-description">Use at least eight characters. You'll be able to sign in with it right away.</p><p id="reset-message" class="portal-error" role="status" hidden></p><form id="reset-form" class="portal-form" style="grid-template-columns:1fr;margin-top:24px"><div class="field"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div><button class="button button-dark" type="submit">Update password ↗</button></form><a href="/auth.html" class="muted" style="display:inline-block;margin-top:20px">Back to sign in</a></section></main></body></html>
