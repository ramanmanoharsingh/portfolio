<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Signing you in · Develop with Raman</title>
  <link rel="stylesheet" href="/client-portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/portal-supabase.js"></script>
  <script defer src="/auth-callback.js"></script>
<link rel="stylesheet" href="/site-chrome.css"><script defer src="/site-chrome.js"></script></head>
<body class="portal-body">
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <section class="portal-card" style="width:min(100%,520px);padding:clamp(24px,5vw,42px)">
      <a class="portal-brand" style="padding:0;display:block;margin-bottom:30px" href="/">Develop with Raman<span>Secure account access</span></a>
      <div class="eyebrow">Authentication</div>
      <h1 class="portal-title" style="font-size:34px" id="callback-title">Finishing sign-in…</h1>
      <p class="portal-subtitle" id="callback-message" role="status" aria-live="polite">Please wait while we verify your session.</p>
      <a class="button button-dark" id="callback-action" href="/auth.html" hidden style="margin-top:20px">Return to sign in ↗</a>
    </section>
  </main>
</body>
</html>
