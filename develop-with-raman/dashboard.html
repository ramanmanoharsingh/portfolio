<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#191b17">
  <title>Opening your workspace · Develop with Raman</title>
  <link rel="stylesheet" href="/client-portal.css">
</head>
<body class="portal-body">
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <section class="portal-card" style="width:min(100%,520px);padding:clamp(24px,5vw,42px)">
      <a class="portal-brand" href="/portal.html" aria-label="Client portal">Develop with Raman<span>Secure workspace</span></a>
      <div class="eyebrow" style="margin-top:28px">One secure workspace</div>
      <h1 class="portal-title" style="font-size:32px;margin-top:10px">Opening your portal…</h1>
      <p class="portal-subtitle">Taking you to the current sign-in and role-aware workspace.</p>
      <p style="margin-top:20px"><a class="button button-dark" href="/portal.html">Continue to client portal ↗</a></p>
    </section>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const target = params.get('mode') === 'recovery'
        ? '/reset-password.html?mode=recovery'
        : '/portal.html';
      location.replace(target + location.hash);
    })();
  </script>
</body>
</html>
