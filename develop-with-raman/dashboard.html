<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f5">
  <title>Opening your workspace · Develop with Raman</title>
  <meta name="description" content="Open your secure Develop with Raman workspace.">
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'signup') {
        location.replace('/auth.html?mode=signup');
      } else if (params.get('mode') === 'recovery') {
        location.replace('/reset-password.html' + location.hash);
      } else {
        location.replace('/welcome.html');
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening your workspace…</h1>
    <p>If you are not redirected, <a href="/welcome.html">continue to your workspace</a> or <a href="/auth.html">sign in</a>.</p>
  </main>
</body>
</html>
