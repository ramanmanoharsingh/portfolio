<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f5">
  <title>Opening account access · Develop with Raman</title>
  <meta name="description" content="Continue to secure Develop with Raman account access.">
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'recovery') {
        location.replace('/reset-password.html' + location.hash);
      } else {
        const signup = params.get('mode') === 'signup' ? '?mode=signup' : '';
        location.replace('/auth.html' + signup);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening account access…</h1>
    <p>If you are not redirected, <a href="/auth.html">continue to sign in</a>.</p>
  </main>
</body>
</html>
